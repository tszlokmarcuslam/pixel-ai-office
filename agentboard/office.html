<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pixel AI Office</title>
<style>
html,body{margin:0;height:100%;background:#140d0a;overflow:hidden;color:#fff;font:bold 14px monospace}
#bar{height:28px;line-height:28px;text-align:center;background:#000a;letter-spacing:1px}
#bar span{color:#9fe3c4}
canvas{display:block;margin:0 auto;image-rendering:pixelated}
#wrap{height:calc(100vh - 28px);overflow:auto}
#zoom{position:fixed;top:3px;left:8px;display:flex;gap:4px;z-index:2}
#zoom button{font:bold 13px monospace;background:#5a2e1c;color:#ffe9a8;border:2px solid #d4a640;padding:1px 8px;cursor:pointer}
#teamBtn{position:fixed;top:3px;right:120px;z-index:2;font:bold 13px monospace;background:#5a2e1c;color:#ffe9a8;border:2px solid #d4a640;padding:1px 8px;cursor:pointer}
#roster{position:fixed;top:30px;right:8px;z-index:3;width:300px;max-height:70vh;overflow:auto;background:#2a1a12f2;border:3px solid #d4a640;padding:4px 10px;font:12px monospace}
#roster h4{margin:8px 0 4px;color:#ffe9a8}
#roster .who{display:flex;gap:6px;align-items:baseline;margin:3px 0}
#roster .who i{width:8px;height:8px;flex:none}
#roster .who b{flex:none;width:72px}
#roster .who span{color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#roster .none{color:#888;margin:2px 0}
#gear{z-index:2;position:fixed;top:3px;right:8px;font:bold 13px monospace;background:#5a2e1c;color:#ffe9a8;border:2px solid #d4a640;padding:1px 8px;cursor:pointer}
dialog{background:#2a1a12;color:#fff;border:3px solid #d4a640;font:13px monospace;min-width:340px}
dialog .row{display:flex;align-items:center;gap:8px;margin:6px 0}
dialog .row b{width:90px}
dialog img{width:24px;height:32px;image-rendering:pixelated;background:#5d7c37}
dialog button{font:inherit;background:#5a2e1c;color:#ffe9a8;border:1px solid #d4a640;cursor:pointer}
</style></head>

<div id="roster" hidden></div>
<button id="gear" type="button">⚙ Sprites</button>

<div id="zoom"><button id="zout" type="button" aria-label="Zoom out">−</button><button id="zfit" type="button">Fit</button><button id="zin" type="button" aria-label="Zoom in">+</button></div>

  const h = (x, y) => { const dx = Math.abs(x - gx), dy = Math.abs(y - gy); return Math.max(dx, dy) + 0.414 * Math.min(dx, dy); };
  const start = sy * NW + sx, goal = gy * NW + gx;
  g[start] = 0; push(h(sx, sy), start);
  while (heap.length) {
    const [, cur] = pop(); if (done[cur]) continue; done[cur] = 1; if (cur === goal) break;
    const cx = cur % NW, cy = (cur / NW) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue; const nx = cx + dx, ny = cy + dy;
      if (!free(nx, ny) || (dx && dy && (!free(cx + dx, cy) || !free(cx, cy + dy)))) continue; // no corner cutting
      const ni = ny * NW + nx, ng = g[cur] + (dx && dy ? 1.414 : 1);
      if (ng < g[ni]) { g[ni] = ng; came[ni] = cur; push(ng + h(nx, ny), ni); }
    }
  }
  let cells = [];
  if (came[goal] >= 0 || goal === start) for (let i = goal; i >= 0; i = i === start ? -1 : came[i]) cells.push([i % NW, (i / NW) | 0]);
  else cells = [[gx, gy], [sx, sy]]; // unreachable: walk straight rather than freeze
  cells.reverse();
  const pts = [cells[0]]; // string-pull: keep only corners we can't see past
  for (let i = 1; i < cells.length; i++) if (i === cells.length - 1 || !clearLine(...pts[pts.length - 1], ...cells[i + 1])) pts.push(cells[i]);
  const out = pts.map(([x, y]) => [x * CELL - FX, y * CELL - FY]);
  out.push(to);
  return out.filter((p, i) => i === out.length - 1 || Math.hypot(p[0] - from[0], p[1] - from[1]) > 1);
}

function updateBody(f, a, i, now, dt) {
  const [sx, sy] = seat(i), st = shown(a, now);
  let b = bodies.get(f);
  if (!b) { // first sight: long-idle agents start out of the office
    b = { x: sx, y: sy, mode: 'seat', path: [], dest: '', wait: 0, flip: false };
    if (!ACTIVE.has(st) && now - a.at > IDLE_LEAVE_MS) { b.mode = 'away'; [b.x, b.y] = DOOR_SPOT; }
    bodies.set(f, b);
  }
  if (b.mode === 'seat') {
    b.x = sx; b.y = sy;
    if (a.handIn) { a.handIn = false; b.mode = 'walk'; b.dest = 'ceo'; line.push(f); b.slotK = line.indexOf(f); b.path = findPath([b.x, b.y], slot(b.slotK)); }
    else if (!ACTIVE.has(st) && now - a.at > IDLE_LEAVE_MS) { b.mode = 'walk'; b.dest = 'door'; b.path = findPath([b.x, b.y], DOOR_SPOT); }
  } else if (b.mode === 'away') {
    if (ACTIVE.has(st) || a.handIn) { b.mode = 'walk'; b.dest = 'seat'; [b.x, b.y] = DOOR_SPOT; b.path = findPath(DOOR_SPOT, seat(i)); }
  }
  if (b.mode !== 'walk') return b;
  if (b.wait > now) return b;
  if (b.dest === 'ceo') {
    b.paper = true;
    // our place in the line moved up: re-plan to the new spot
    const k = line.indexOf(f);
    if (k !== b.slotK) { b.slotK = k; b.path = findPath([b.x, b.y], slot(k)); }
    if (!b.path.length && b.handing) { // finished handing in: leave the line and walk back
      papers++; b.handing = false; b.paper = false; line.splice(k, 1);
      b.dest = 'seat'; b.path = findPath([b.x, b.y], seat(i)); return b;
    }
    if (!b.path.length) { b.flip = false; if (k === 0) { b.handing = true; b.wait = now + HAND_MS; } return b; }
  }

    return b;
  }

  if (b.dest === 'door' && ACTIVE.has(st)) { b.dest = 'seat'; b.path = findPath([b.x, b.y], seat(i)); }
  let step = SPEED * dt;
  while (step > 0 && b.path.length) {
    const [tx, ty] = b.path[0], dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy);
    if (Math.abs(dx) > 0.01) b.flip = dx < 0;
    if (d <= step) { b.x = tx; b.y = ty; b.path.shift(); step -= d; } else { b.x += dx / d * step; b.y += dy / d * step; step = 0; }

}
const where = (b) => b.mode === 'away' ? 'out of office' : b.mode === 'walk' ? ({ ceo: 'handing in', door: 'heading out', seat: 'walking back' }[b.dest]) : null;

// ---------- drawing (everything depth-sorted by its base line, so desks hide anyone behind them) ----------
const HAND = { claude: '#d97757', robot: '#9aa4b1' };
const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7) >>> 0;
function drawDesk(f, a, st, sx, sy, t, b) {
  rect('#a0622f', sx - 5, sy + 13, 22, 4); rect('#6b3b22', sx - 5, sy + 17, 22, 5); rect('#4c2617', sx - 4, sy + 22, 2, 3); rect('#4c2617', sx + 14, sy + 22, 2, 3);
  const here = b.mode === 'seat';
  const glow = here ? ({ working: '#5ad1ff', thinking: '#b48cff', waiting: '#ffd34d', error: '#ff5a5a', done: '#6fe08a' }[st] || '#555') : '#2a2a33';
  rect('#3b3f4a', sx - 4, sy + 9, 6, 5); rect(glow, sx - 2, sy + 11, 2, 1); // laptop
  const sip = here && st === 'idle' && (t + hash(f) % 6000) % 6000 < 900; // idle: sip coffee every few seconds
  if (!sip) rect('#f4f4f4', sx + 14, sy + 11, 3, 3);
  if (!here) return;
  const hand = HAND[SPRITES[f] ? f : 'robot'] || BASE.S;
  if (st === 'working') { // writing: a sheet fills with scribbled lines, pen hand follows the newest line
    const p = ((t + hash(f) % 3000) % 4500) / 4500 * 3; // 3 lines per sheet, then a fresh sheet
    rect('#e8e0d0', sx + 1.5, sy + 12.5, 10, 4); rect('#fffaf0', sx + 1, sy + 12, 10, 4); // sheet + shadow
    let px = sx + 2, py = sy + 13;
    for (let j = 0; j < 3; j++) {
      const w = Math.max(0, Math.min(1, p - j)) * 8;
      for (let x = 0; x < w; x += 0.5) rect('#6a6f80', sx + 2 + x, sy + 13 + j + (Math.floor(x * 2) % 3 === 1 ? -0.5 : 0) * 0.5, 0.5, 0.5);
      if (p > j) { px = sx + 2 + w; py = sy + 13 + j; }
    }
    const wob = Math.floor(t / 80) % 2 * 0.5;
    rect('#2a2a33', px + 0.5, py - 2.5 + wob, 0.5, 2.5); // pen
    rect(hand, px, py - 1 + wob, 2, 1.5);                // writing hand
    rect(hand, sx + 9.5, sy + 14, 2, 1.5);               // other hand holds the sheet
  } else if (st !== 'idle' || !sip) { rect(hand, sx + 2, sy + 12, 2, 2); rect(hand, sx + 8, sy + 12, 2, 2); }
  if (sip) { rect(hand, sx + 9, sy + 8, 2, 2); rect('#f4f4f4', sx + 9, sy + 6, 3, 3); }
}
function drawSeated(f, st, sx, sy, t) {
  const ph = t + hash(f) % 4000;
  const blink = ph % 3600 < 140;
  let bob = 0, lean = 0, flip = false, eyesClosed = blink;
  if (st === 'working') { lean = 1 + (Math.floor(ph / 380) % 3 === 0 ? 1 : 0); bob = 0; }        // head down over the paper, small nods with the pen
  else if (st === 'thinking') { bob = Math.floor(t / 600) % 2; lean = ph % 2400 < 1200 ? 0 : 1; /* never negative: a lifted head opens a gap at the neck */ }
  else if (st === 'idle') { eyesClosed = true; lean = 2 + Math.floor(ph / 1500) % 2; bob = Math.floor(ph / 1500) % 2; } // snoozing: slow breaths
  else bob = Math.floor(ph / 1200) % 2;
  if (!RIG[f] && st === 'idle') { eyesClosed = false; flip = ph % 9000 > 6500; } // drawn sprites can't close eyes: glance around instead
  sprite(SPRITES[f] || SPRITES.robot, sx, sy + bob, f, { flip, lean, eyesClosed, drop: RIG[f]?.seatDrop }); // seatDrop: long-legged sprites sit lower so the desk hides their legs
  const iy = sy - 6 - (Math.floor(t / 300) % 2), glow = COLORS[st];
  if (st === 'thinking') for (let i = 0; i < 3; i++) rect(i <= Math.floor(t / 300) % 3 ? '#fff' : '#777', sx + 3 + i * 3, iy + 2, 2, 2);
  if (st === 'waiting' || st === 'error') { rect(glow, sx + 5, iy - 2, 2, 5); rect(glow, sx + 5, iy + 4, 2, 2); }
  if (st === 'done') { rect('#6fe08a', sx + 3, iy + 2, 2, 2); rect('#6fe08a', sx + 5, iy + 3, 2, 2); rect('#6fe08a', sx + 7, iy + 1, 2, 2); rect('#6fe08a', sx + 9, iy - 1, 2, 2); }
  if (st === 'idle') for (let k = 0; k < 2; k++) { // two Zs drift up and fade
    const p = ((ph / 2200) + k / 2) % 1, zx = sx + 10 + p * 5, zy = iy + 2 - p * 8, z = k ? 0.5 : 1;
    g.globalAlpha = 1 - p;
    for (const [dx, dy] of [[0, 0], [1, 0], [2, 0], [1.5, 0.5], [1, 1], [0.5, 1.5], [0, 2], [1, 2], [2, 2]]) rect('#cfd8ff', zx + dx * z, zy + dy * z, 0.5 * z + 0.5, 0.5 * z + 0.5);
    g.globalAlpha = 1;

}
function drawWalker(f, b, t) {
  const now = Date.now(), moving = b.wait <= now && b.path.length > 0;
  const stepN = moving ? 1 + (Math.floor(t / 160) % 2) : 0;
  const x = b.x, y = b.y - (moving && stepN === 1 ? 1 : 0);
  const handing = b.handing && b.wait > now, p = handing ? 1 - (b.wait - now) / HAND_MS : 0; // 0..1 through the hand-in
  const lean = handing ? (p < 0.7 ? 2 : 1) : moving ? stepN - 1 : 0;                     // bow while handing over; bounce while walking
  rect('rgba(0,0,0,.25)', Math.round(b.x) + 2, Math.round(b.y) + 15, 8, 2); // shadow
  sprite(SPRITES[f] || SPRITES.robot, x, y, f, { flip: b.flip !== !!RIG[f]?.facesLeft, step: stepN, /* art drawn facing left mirrors the other way */ lean, eyesClosed: handing && p > 0.2 && p < 0.6 });
  if (!b.paper) return;
  let px = Math.round(x) + (b.flip ? -3 : 10), py = Math.round(y) + 9;
  if (handing) { const tx = ceoX() + 279, ty = 90; px += (tx - px) * Math.min(1, p * 1.4); py += (ty - py) * Math.min(1, p * 1.4) - Math.sin(Math.min(1, p * 1.4) * Math.PI) * 3; }
  rect('#fffaf0', px, py, 5, 6); rect('#9aa4b1', px + 1, py + 1, 3, 1); rect('#9aa4b1', px + 1, py + 3, 3, 1);
}
function drawCeoBack(t) {
  const X = ceoX();
  rect('#d4a640', X + 264, 70, 20, 26); rect('#8e2b25', X + 266, 72, 16, 22); // chair back
  sprite(SPRITES.ceo, X + 268, 82 + (Math.floor(t / 900) % 2), 'ceo');
}
function drawCeoDesk() {
  const X = ceoX();
  rect('#4a1f14', X + 248, 96, 52, 6); rect('#2e130c', X + 248, 102, 52, 12); rect('#d4a640', X + 248, 96, 52, 1); rect('#d4a640', X + 266, 104, 16, 5);
  rect('#3b3f4a', X + 252, 89, 10, 7); rect('#5ad1ff', X + 253, 90, 8, 5); // monitor
  rect('#ffd34d', X + 290, 88, 6, 1); rect('#c98b4a', X + 292, 89, 2, 7); // desk lamp
  for (let k = 0; k < Math.min(papers, 10); k++) rect(k % 2 ? '#fffaf0' : '#e8e0d0', X + 280, 95 - k, 7, 1); // handed-in paperwork
}

function light() {
  g.globalCompositeOperation = 'lighter';
  for (const [x, y, r] of [[24, 44, 40], [ceoX() + 292, 92, 46], [W / 2, 14, 60]]) {
    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,170,80,.22)'); gr.addColorStop(1, 'rgba(255,170,80,0)');

  g.globalCompositeOperation = 'source-over';
  const v = g.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, Math.max(200, W * 0.6)); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.5)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);

// ---------- text, drawn at screen scale so it stays crisp ----------
function text(s, x, y, color = '#fff', size = 3) {
  ctx.font = `bold ${size * S}px monospace`; ctx.textAlign = 'center';
  ctx.lineWidth = Math.max(1, S * 0.6); ctx.strokeStyle = '#120b08'; ctx.strokeText(s, x * S, y * S);
  ctx.fillStyle = color; ctx.fillText(s, x * S, y * S);
}
function bubble(s, x, y) {
  if (!s) return;
  ctx.font = `bold ${2.6 * S}px monospace`;
  s = s.length > 26 ? s.slice(0, 25) + '…' : s;
  const w = ctx.measureText(s).width + 8, h = 4 * S, X = Math.min(Math.max(x * S - w / 2, 2), cv.width - w - 2), Y = y * S - h;
  ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#120b08'; ctx.lineWidth = 2;
  ctx.fillRect(X, Y, w, h); ctx.strokeRect(X, Y, w, h);
  ctx.fillStyle = '#2a1a12'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(s, X + 4, Y + h / 2); ctx.textBaseline = 'alphabetic';
}
const COLORS = { working: '#5ad1ff', thinking: '#b48cff', waiting: '#ffd34d', error: '#ff5a5a', done: '#6fe08a', idle: '#aaa' };

let lastT = 0, doorOpen = 0;
function frame(t) {
  const now = Date.now(), dt = Math.min(0.1, (t - lastT) / 1000 || 0); lastT = t;
  layout();
  // door opens while anyone walks near it, then swings shut
  const near = [...bodies.values()].some((b) => b.mode === 'walk' && Math.hypot(b.x - DOOR_SPOT[0], b.y - DOOR_SPOT[1]) < 22);
  doorOpen += ((near ? 1 : 0) - doorOpen) * Math.min(1, dt * 5);
  g.setTransform(2, 0, 0, 2, 0, 0);
  room(t);
  const draws = [], labels = []; // [baseY, fn]
  [...agents].forEach(([f, a], i) => {
    const [sx, sy] = seat(i), st = shown(a, now), b = updateBody(f, a, i, now, dt);
    draws.push([sy + 25, () => drawDesk(f, a, st, sx, sy, t, b)]);
    if (b.mode === 'seat') draws.push([sy + 16, () => drawSeated(f, st, sx, sy, t)]);
    else if (b.mode === 'walk') draws.push([b.y + 16, () => drawWalker(f, b, t)]);
    labels.push([f, a, sx, sy, st, b]);
  });

  draws.sort((m, n) => m[0] - n[0]).forEach(([, fn]) => fn());

  ctx.drawImage(off, 0, 0, W * S, H * S);
  text('AI OFFICE', W / 2, 17, '#ffe9a8', 4);
  for (const [f, a, sx, sy, st, b] of labels) {
    const w = where(b);
    text((SPRITES[f]?.name || f.toUpperCase()), sx + 6, sy + 30, w === 'out of office' ? '#888' : '#fff');
    text(w || st, sx + 6, sy + 35, w ? '#e0c080' : COLORS[st] || '#fff', 2.4);
    if (b.mode === 'seat' && st !== 'idle') bubble(a.detail, sx + 6, sy - 8);
  }
  const cx = ceoX() + 274;
  text('CEO (you)', cx, 122, '#ffe9a8');
  text(`${total} routed · ${papers} handed in`, cx, 128, '#ddd', 2.4);
  if (lastOrder) bubble('→ ' + (SPRITES[lastOrder.f]?.name || lastOrder.f) + ': ' + lastOrder.text, cx, 66);

}
requestAnimationFrame(frame);

// ---------- team drop-down: who is working, who is resting ----------
const teamBtn = document.getElementById('teamBtn'), roster = document.getElementById('roster');
function renderRoster() {
  const now = Date.now(), work = [], rest = [];
  for (const [f, a] of agents) {
    const st = shown(a, now), b = bodies.get(f), w = b && where(b);
    (ACTIVE.has(st) ? work : rest).push({ name: SPRITES[f]?.name || f, st: w || st, detail: ACTIVE.has(st) ? a.detail : '' });
  }
  roster.textContent = '';
  for (const [title, list] of [[`Working (${work.length})`, work], [`Resting (${rest.length})`, rest]]) {
    const h = document.createElement('h4'); h.textContent = title; roster.append(h);
    if (!list.length) { const p = document.createElement('p'); p.className = 'none'; p.textContent = 'Nobody'; roster.append(p); }
    for (const it of list) {
      const row = document.createElement('div'); row.className = 'who';
      const dot = document.createElement('i'); dot.style.background = COLORS[it.st] || '#e0c080';
      const n = document.createElement('b'); n.textContent = it.name;
      const s = document.createElement('span'); s.textContent = it.st + (it.detail ? ' · ' + it.detail : '');
      row.append(dot, n, s); roster.append(row);
    }
  }
}
teamBtn.onclick = () => { roster.hidden = !roster.hidden; teamBtn.setAttribute('aria-expanded', String(!roster.hidden)); if (!roster.hidden) renderRoster(); };
setInterval(() => { if (!roster.hidden) renderRoster(); }, 500);

// ---------- custom sprites (PNG upload, kept in localStorage) ----------
function loadCustom(k) {
  const d = localStorage.getItem('sprite:' + k);
  if (!d) { delete custom[k]; return; }
  const im = new Image(); im.onload = () => { custom[k] = im; }; im.src = d;
}
async function upload(k, file) {
  if (!file || !/^image\/png$/.test(file.type)) { alert('Please choose a PNG file.'); return; }
  const bmp = await createImageBitmap(file);
  const r = Math.min(1, 96 / bmp.width, 128 / bmp.height); // shrink big images so they fit in localStorage
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * r)); c.height = Math.max(1, Math.round(bmp.height * r));
  const cx = c.getContext('2d'); cx.imageSmoothingEnabled = false; cx.drawImage(bmp, 0, 0, c.width, c.height);
  try { localStorage.setItem('sprite:' + k, c.toDataURL('image/png')); } catch { alert('Could not save: browser storage is full.'); return; }
  loadCustom(k); renderList();
}
function renderList() {
  const list = document.getElementById('list'); list.textContent = '';
  for (const k of [...agents.keys(), 'ceo']) {
    const row = document.createElement('div'); row.className = 'row';
    const name = document.createElement('b'); name.textContent = SPRITES[k]?.name || k;
    const img = document.createElement('img'); img.alt = ''; const d = localStorage.getItem('sprite:' + k); if (d) img.src = d; else img.style.visibility = 'hidden';
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/png'; inp.setAttribute('aria-label', `Sprite for ${name.textContent}`);
    inp.onchange = () => upload(k, inp.files[0]);
    const reset = document.createElement('button'); reset.type = 'button'; reset.textContent = 'Reset';
    reset.onclick = () => { localStorage.removeItem('sprite:' + k); loadCustom(k); renderList(); };
    row.append(name, img, inp, reset); list.append(row);
  }
}
for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('sprite:')) loadCustom(k.slice(7)); }
document.getElementById('gear').onclick = () => { renderList(); document.getElementById('dlg').showModal(); };

// ---------- live data ----------
const conn = document.getElementById('conn');
if (new URLSearchParams(location.search).has('demo')) {
  conn.textContent = 'demo';
  const tasks = ['Refactor auth module', 'Summarise PDF', 'Write unit tests', 'Translate docs to FR', 'Fix CSS overflow', 'Plan Q3 roadmap', 'Explain regex'];
  const fams = [...FIXED, 'qwen'];
  setInterval(() => {
    const f = fams[Math.floor(Math.random() * fams.length)], task = tasks[Math.floor(Math.random() * tasks.length)];
    const state = ['working', 'working', 'thinking', 'waiting', 'done', 'error'][Math.floor(Math.random() * 6)];
    apply({ agent: f, platform: 'router', state, detail: task, task, ts: new Date().toISOString() });
  }, 1400);
} else {
  const es = new EventSource('/events');
  es.onopen = () => { conn.textContent = 'live'; };
  es.onerror = () => { conn.textContent = 'reconnecting…'; };
  es.addEventListener('reset', () => { bodies.clear(); line.length = 0; for (const f of [...agents.keys()]) FIXED.includes(f) ? agents.set(f, { state: 'idle', detail: '', at: 0 }) : agents.delete(f); total = 0; lastOrder = null; });
  es.addEventListener('replay', (m) => { try { JSON.parse(m.data).forEach(apply); } catch {} });
  es.addEventListener('agent-event', (m) => { try { apply(JSON.parse(m.data)); } catch {} });
}
