<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pixel AI Office</title>
<style>
/* --- shared layout --- */
html,body{margin:0;height:100%;background:#140d0a;overflow:hidden;color:#f5f5f7}
canvas{display:block;margin:0 auto;image-rendering:pixelated}
#bar{position:fixed;top:0;left:0;right:0;height:36px;z-index:1;display:flex;align-items:center;padding-left:150px;white-space:nowrap;overflow:hidden;box-sizing:border-box}
#wrap{position:relative;height:100vh;box-sizing:border-box;padding-top:36px;overflow:auto;cursor:grab;touch-action:none;overscroll-behavior:contain}
#zoom{position:fixed;top:6px;left:10px;z-index:2;display:flex}
#tools{position:fixed;top:6px;right:10px;z-index:2;display:flex;gap:2px}
#tools > button,#zoom button{display:flex;align-items:center;gap:6px;cursor:pointer}
.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.px{width:14px;height:14px;image-rendering:pixelated;flex:none}
.caret{opacity:.55;font-size:9px}
#langMenu,#themeMenu,#roster{position:fixed;top:40px;right:10px;z-index:3;margin:0;list-style:none}
#langMenu button,#themeMenu button{display:block;width:100%;text-align:left;font:inherit;background:none;color:inherit;border:0;cursor:pointer}
#themeMenu i{display:inline-block;width:10px;height:10px;margin-right:8px;vertical-align:-1px}
#roster{width:400px;max-height:70vh;overflow:auto}
#roster .who{display:flex;gap:8px;align-items:baseline;margin:4px 0}
#roster .who i{width:8px;height:8px;flex:none}
#roster .who b{flex:none;width:70px}
#roster .who em{flex:none;width:118px;font-style:normal;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#roster .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog{min-width:340px}
dialog .row{display:flex;align-items:center;gap:8px;margin:8px 0}
dialog .row b{width:80px}
dialog input.role{width:150px;font:inherit;padding:3px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:inherit}
body.retro dialog input.role{border-radius:0;border:1px solid #d4a640;background:#1a100b}
dialog img{width:24px;height:32px;image-rendering:pixelated;background:#5d7c37}
dialog button{font:inherit;cursor:pointer}

/* --- modern (default): thin translucent macOS-style bar, system text, rounded soft panels --- */
body{font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
#bar{background:rgba(28,24,26,.55);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.6)}
#bar .dot{color:#30d158;margin-right:6px;font-size:9px}
#conn{color:rgba(255,255,255,.85);overflow:hidden;text-overflow:ellipsis}
#zoom{background:rgba(255,255,255,.08);border-radius:7px;padding:2px}
#zoom button{font:inherit;height:22px;min-width:26px;justify-content:center;background:none;color:#f5f5f7;border:0;border-radius:5px;padding:0 8px}
#tools > button{font:inherit;height:24px;background:none;color:#f5f5f7;border:0;border-radius:6px;padding:0 9px}
#tools > button:hover,#zoom button:hover,#tools > button[aria-expanded="true"],#tools > button[aria-pressed="true"]{background:rgba(255,255,255,.14)}
#tools > button:focus-visible,#zoom button:focus-visible,#langMenu button:focus-visible,#themeMenu button:focus-visible,dialog button:focus-visible{outline:2px solid #0a84ff;outline-offset:1px}
#langMenu,#themeMenu,#roster,dialog{background:rgba(40,36,40,.82);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid rgba(255,255,255,.1);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);color:#f5f5f7}
#langMenu,#themeMenu{padding:5px;min-width:170px}
#langMenu button,#themeMenu button{padding:5px 10px 5px 26px;border-radius:6px;position:relative}
#langMenu button:hover,#themeMenu button:hover{background:#0a84ff;color:#fff}
#langMenu button[aria-checked="true"]::before,#themeMenu button[aria-checked="true"]::before{content:'✓';position:absolute;left:9px}
#themeMenu i{border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
#roster{padding:8px 14px 10px}
#roster h4{margin:8px 0 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.5)}
#roster .who i{border-radius:50%}
#roster .who b{font-weight:600}
#roster .who span{color:rgba(255,255,255,.65)}
#roster .none{color:rgba(255,255,255,.4);margin:2px 0}
dialog{padding:16px 20px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 6px;font-size:15px;font-weight:600}
dialog p{color:rgba(255,255,255,.7)}
dialog img{border-radius:4px}
dialog button{background:rgba(255,255,255,.14);color:#f5f5f7;border:0;border-radius:6px;padding:4px 12px}
dialog button:hover{background:rgba(255,255,255,.22)}

/* --- retro: the full pixel look --- */
body.retro{font:bold 14px monospace}
body.retro #bar{background:#000a;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;font:bold 14px monospace;letter-spacing:1px;color:#fff}
body.retro #bar .dot{color:#9fe3c4}
body.retro #conn{color:#9fe3c4}
body.retro #zoom{background:none;padding:0;gap:4px}
body.retro #zoom button,body.retro #tools > button{font:bold 13px monospace;background:#5a2e1c;color:#ffe9a8;border:2px solid #d4a640;border-radius:0;padding:1px 8px;height:auto}
body.retro #tools{gap:6px}
body.retro #tools > button:hover,body.retro #zoom button:hover,body.retro #tools > button[aria-expanded="true"],body.retro #tools > button[aria-pressed="true"]{background:#7a4026}
body.retro .px{width:16px;height:16px}
body.retro #langMenu,body.retro #themeMenu,body.retro #roster,body.retro dialog{background:#2a1a12f2;-webkit-backdrop-filter:none;backdrop-filter:none;border:3px solid #d4a640;border-radius:0;box-shadow:none;font:13px monospace;color:#fff}
body.retro #langMenu,body.retro #themeMenu{padding:4px}
body.retro #langMenu button,body.retro #themeMenu button{padding:4px 10px;border-radius:0}
body.retro #langMenu button:hover,body.retro #themeMenu button:hover{background:#5a2e1c;color:#ffe9a8}
body.retro #langMenu button[aria-checked="true"],body.retro #themeMenu button[aria-checked="true"]{color:#ffe9a8}
body.retro #langMenu button[aria-checked="true"]::before,body.retro #themeMenu button[aria-checked="true"]::before{content:'▸ ';position:static}
body.retro #themeMenu i{border-radius:0;border:1px solid #120b08;box-shadow:none}
body.retro #roster{font:12px monospace;padding:4px 10px}
body.retro #roster h4{color:#ffe9a8;font-size:12px;text-transform:none;letter-spacing:0;font-weight:bold}
body.retro #roster .who i{border-radius:0}
body.retro #roster .who span{color:#ccc}
body.retro dialog h3{font-size:15px}
body.retro dialog p{color:#fff}
body.retro dialog button{background:#5a2e1c;color:#ffe9a8;border:1px solid #d4a640;border-radius:0}
body.retro dialog img{border-radius:0}
</style></head>

langMenu.addEventListener('keydown', (e) => {
  const items = [...langMenu.querySelectorAll('button')], i = items.indexOf(document.activeElement);
  if (e.key === 'Escape') { closeLang(); langBtn.focus(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
});
document.addEventListener('click', (e) => { if (!langMenu.hidden && !langMenu.contains(e.target) && !langBtn.contains(e.target)) closeLang(); });
applyLang(); applyTheme(); placeStatus();
if (new URLSearchParams(location.search).has('demo')) {
  setConn('demo');
  const tasks = ['Refactor auth module', 'Summarise PDF', 'Write unit tests', 'Translate docs to FR', 'Fix CSS overflow', 'Plan Q3 roadmap', 'Explain regex'];
  const fams = [...FIXED, 'qwen'];
  setInterval(() => {
    const f = fams[Math.floor(Math.random() * fams.length)], task = tasks[Math.floor(Math.random() * tasks.length)];
    const state = ['working', 'working', 'thinking', 'waiting', 'done', 'error'][Math.floor(Math.random() * 6)];
    apply({ agent: f, platform: 'router', state, detail: task, task, ts: new Date().toISOString() });
  }, 1400);
} else {
  const es = new EventSource('/events');
  es.onopen = () => setConn('live');
  es.onerror = () => setConn('reconnecting');
  es.addEventListener('reset', () => { bodies.clear(); line.length = 0; agents.clear(); META.clear(); total = 0; lastOrder = null; });
  es.addEventListener('replay', (m) => { try { JSON.parse(m.data).forEach(apply); } catch {} });
  es.addEventListener('agent-event', (m) => { try { apply(JSON.parse(m.data)); } catch {} });
}
</script>
