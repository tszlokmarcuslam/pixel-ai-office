<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentBoard</title>
<style>
:root {
  --bg: #faf9f5; --bg-2: #f0eee6; --surface: #ffffff; --border: #e6e2d7; --border-2: #d5d0c2;
  --text: #1f1e1b; --text-2: #5e5c55; --text-3: #8f8c82;
  --accent: #c96442; --accent-2: #b0553a; --accent-soft: #f7e8e0;
  --cc: #c96442; --codex: #10a37f;
  --s-idle: #a8a29e; --s-thinking: #5b8def; --s-working: #3fa66b; --s-waiting: #e8a33d; --s-done: #8b6fe8; --s-error: #e5534b; --s-stale: #8c8a82;
  --shadow: 0 1px 2px rgba(31, 30, 27, .05), 0 8px 28px rgba(31, 30, 27, .08);
  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262624; --bg-2: #1f1e1d; --surface: #30302e; --border: #3d3c38; --border-2: #4b4a45;
    --text: #f3f1ea; --text-2: #bdbab0; --text-3: #8a877e; --accent: #d97757; --accent-2: #e58c6e; --accent-soft: #3b2c26;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #262624; --bg-2: #1f1e1d; --surface: #30302e; --border: #3d3c38; --border-2: #4b4a45;
  --text: #f3f1ea; --text-2: #bdbab0; --text-3: #8a877e; --accent: #d97757; --accent-2: #e58c6e; --accent-soft: #3b2c26;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 400 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
code, kbd { font-family: var(--mono); font-size: 12.5px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.sr-only:focus-within { position: fixed; left: 16px; bottom: 80px; width: auto; height: auto; clip: auto; margin: 0; z-index: 20; background: var(--surface); padding: 8px; border-radius: 10px; box-shadow: var(--shadow); }

/* top bar */
.topbar { position: absolute; inset: 0 0 auto 0; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); z-index: 6; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { margin: 0; font: 500 19px/1.2 var(--serif); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; background: var(--bg-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 13px; border-radius: 8px; color: var(--text-2); font-weight: 500; transition: background .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 1px var(--border); }
.spacer { flex: 1; }
.summary { display: flex; align-items: center; gap: 14px; color: var(--text-2); font-size: 13px; white-space: nowrap; }
.summary span { display: inline-flex; align-items: center; gap: 6px; }
.summary b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.ico { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 700; flex: none; line-height: 1; }
.st-idle { background: var(--s-idle); } .st-thinking { background: var(--s-thinking); } .st-working { background: var(--s-working); }
.st-waiting { background: var(--s-waiting); } .st-done { background: var(--s-done); } .st-error { background: var(--s-error); } .st-stale { background: var(--s-stale); }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border-2); background: var(--surface); padding: 6px 12px; border-radius: 9px; font-weight: 500; transition: background .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease); white-space: nowrap; }
.btn:hover { background: var(--bg-2); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--bg-2); }
.icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 0; background: transparent; display: grid; place-items: center; color: var(--text-2); font-size: 18px; transition: background .15s var(--ease); }
.icon-btn:hover { background: var(--bg-2); color: var(--text); }
.conn-dots { display: inline-flex; gap: 4px; }
.conn-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--s-idle); box-shadow: 0 0 0 2px var(--surface); }
.conn-dots i.ok { background: var(--s-working); } .conn-dots i.warn { background: var(--s-waiting); }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: 42px; min-width: 230px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 10;
  opacity: 0; transform: translateY(-4px) scale(.98); transform-origin: top right; pointer-events: none; transition: opacity .16s var(--ease), transform .16s var(--ease); }
.menu.open { opacity: 1; transform: none; pointer-events: auto; }
.menu button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; text-align: left; }
.menu button:hover { background: var(--bg-2); }
.menu button[aria-checked="true"]::after { content: "✓"; color: var(--accent); }
.menu .label { font-size: 11px; color: var(--text-3); padding: 8px 10px 4px; text-transform: uppercase; letter-spacing: .06em; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 6px 4px; }
.menu kbd { color: var(--text-3); }

/* stage */
#stage { position: absolute; inset: 56px 0 0 0; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#game.hovering { cursor: pointer; } #game.dragging { cursor: grabbing; }

/* attention banner */
.attn { position: absolute; top: 14px; left: 50%; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; z-index: 5; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 8px 8px 8px 12px; max-width: calc(100% - 32px); transition: opacity .2s var(--ease), transform .2s var(--ease); }
.attn.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.attn .msg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attn .msg b { font-weight: 600; }
.attn .msg span { color: var(--text-2); }

/* activity drawer */
.drawer { position: absolute; left: 16px; bottom: 16px; width: min(720px, calc(100% - 32px)); height: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); z-index: 4; display: flex; flex-direction: column; overflow: hidden; transition: height .25s var(--ease); }
.drawer.collapsed { height: 48px; }
.drawer-h { display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; height: 47px; flex: none; }
.drawer-h h2 { margin: 0; font: 500 15px var(--serif); }
.ticker { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; overflow: hidden; }
.ticker .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker b { color: var(--text); font-weight: 600; }
.drawer:not(.collapsed) .ticker { visibility: hidden; }
.chev { transition: transform .25s var(--ease); display: inline-block; }
.drawer.collapsed .chev { transform: rotate(180deg); }
.filters { display: flex; gap: 8px; padding: 0 14px 10px; flex-wrap: wrap; align-items: center; }
.filters select { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; max-width: 220px; }
.filters .n { margin-left: auto; color: var(--text-3); font-size: 12px; }
#feed { list-style: none; margin: 0; padding: 0 6px 8px; overflow: auto; flex: 1; border-top: 1px solid var(--border); }
.ev { display: grid; grid-template-columns: 64px 20px minmax(70px, 130px) 1fr; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; font-size: 13px; animation: fadein .3s var(--ease); }
.ev:hover { background: var(--bg-2); }
@keyframes fadein { from { opacity: 0; transform: translateY(-3px); } }
.ev time { color: var(--text-3); font-variant-numeric: tabular-nums; font-size: 12px; }
.ev .who { display: flex; gap: 7px; align-items: center; min-width: 0; font-weight: 500; }
.ev .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .det { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.ev .det em { color: var(--text-3); font-style: normal; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #fff; }
.tag.cc { background: var(--cc); } .tag.codex { background: var(--codex); }
.empty { color: var(--text-2); padding: 18px 10px; }
.empty .btn { margin-left: 6px; }

/* team panel: list of people, or one person's details */
.side { position: absolute; top: 16px; right: 16px; bottom: 16px; width: min(340px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); z-index: 5; display: flex; flex-direction: column; overflow: hidden;
  opacity: 0; transform: translateX(14px); pointer-events: none; transition: opacity .22s var(--ease), transform .22s var(--ease); }
.side.open { opacity: 1; transform: none; pointer-events: auto; }
body.side-open .drawer { width: min(720px, calc(100% - 32px - 356px)); }
.listview, .detail { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.detail { display: none; }
.side.show-detail .detail { display: flex; }
.side.show-detail .listview { display: none; }
.side-h { display: flex; align-items: baseline; gap: 8px; padding: 14px 10px 8px 16px; }
.side-h h2 { margin: 0; font: 500 19px var(--serif); }
.side-h .sub { color: var(--text-3); font-size: 12.5px; }
.side-h .icon-btn { margin-left: auto; align-self: center; }
.team { list-style: none; margin: 0; padding: 0 8px 8px; overflow: auto; flex: 1; }
.member { width: 100%; display: grid; grid-template-columns: 42px 1fr auto; gap: 11px; align-items: center; text-align: left; border: 0; background: transparent; padding: 8px; border-radius: 12px; transition: background .15s var(--ease); }
.member:hover, .member.hl { background: var(--bg-2); }
.avatar { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 21px; position: relative; }
.avatar .ico { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; font-size: 9px; box-shadow: 0 0 0 2px var(--surface); }
.member .t1 { display: flex; align-items: center; gap: 6px; font-weight: 600; min-width: 0; }
.member .t1 .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member .t2 { display: block; color: var(--text-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.member .when { color: var(--text-3); font-size: 11.5px; white-space: nowrap; align-self: start; padding-top: 4px; }
.side-f { padding: 10px 12px 12px; border-top: 1px solid var(--border); }
.side-f .btn { width: 100%; justify-content: center; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--text-2); padding: 12px 16px 0; font-weight: 500; }
.back:hover { color: var(--text); }
.sheet-h { display: flex; gap: 14px; padding: 10px 16px 14px; align-items: center; }
#portrait { width: 84px; height: 84px; border-radius: 16px; flex: none; background: var(--bg-2); }
.sheet-h h2 { margin: 0; font: 500 22px/1.15 var(--serif); }
.sheet-h .role { color: var(--text-2); font-size: 13px; margin-top: 3px; }
.sheet-h .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 3px; border-radius: 999px; background: var(--bg-2); font-size: 12px; font-weight: 500; }
.pill.plain { padding: 1px 8px; font-size: 11px; color: var(--text-2); }
.sheet-b { padding: 0 16px 16px; overflow: auto; flex: 1; }
.now { background: var(--bg-2); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
.now .lbl { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.now .val { font-weight: 500; margin-top: 2px; }
.now .sub { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.kv { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; font-size: 13px; margin: 0 0 12px; }
.kv dt { color: var(--text-3); } .kv dd { margin: 0; word-break: break-word; }
.sheet-b h3 { font: 500 14px var(--serif); margin: 16px 0 6px; }
.desc { color: var(--text-2); font-size: 13px; }
.p-ev { display: grid; grid-template-columns: 58px 18px 1fr; gap: 8px; align-items: start; padding: 6px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
.p-ev time { color: var(--text-3); font-variant-numeric: tabular-nums; }

/* hover card */
.tip { position: absolute; z-index: 6; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 9px 12px; max-width: 280px; font-size: 12.5px; opacity: 0; transform: translate(-50%, calc(-100% - 6px)); transition: opacity .14s var(--ease), transform .14s var(--ease); }
.tip.show { opacity: 1; transform: translate(-50%, calc(-100% - 12px)); }
.tip .r { display: flex; gap: 7px; align-items: center; font-weight: 600; }
.tip .s { color: var(--text-2); margin-top: 4px; display: flex; gap: 6px; align-items: center; }
.tip .s .ico { width: 16px; height: 16px; font-size: 9px; }
.tip .hint { color: var(--text-3); font-size: 11.5px; }

/* setup / welcome dialog */
dialog { border: 1px solid var(--border); border-radius: 18px; padding: 0; width: min(600px, calc(100% - 32px)); max-height: calc(100% - 40px); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(20, 18, 14, .28); backdrop-filter: blur(2px); }
dialog[open] { animation: pop .22s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.985); } }
.dlg-h { padding: 22px 22px 4px; display: flex; align-items: flex-start; gap: 12px; }
.dlg-h h2 { margin: 0; font: 500 24px/1.2 var(--serif); }
.dlg-h p { margin: 6px 0 0; color: var(--text-2); font-size: 14px; }
.dlg-b { padding: 10px 22px 4px; }
.conn { border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin: 10px 0; }
.conn-h { display: flex; align-items: center; gap: 12px; }
.mark { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; flex: none; }
.mark.cc { background: var(--cc); } .mark.codex { background: var(--codex); } .mark.demo { background: var(--accent); }
.conn-h .name { font-weight: 600; }
.conn-h .state { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.conn-h .btn { margin-left: auto; }
.roster { margin: 10px 0 0; font-size: 13px; color: var(--text-2); line-height: 1.7; }
.steps { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 7px; }
.steps li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 13.5px; align-items: start; }
.steps .chk { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; margin-top: 1px; border: 1.5px solid var(--border-2); color: transparent; }
.steps li.ok .chk { background: var(--s-working); border-color: var(--s-working); color: #fff; }
.steps li.todo .chk { border-color: var(--s-waiting); color: var(--s-waiting); }
.steps .hint, .row .hint { color: var(--text-2); font-size: 12.5px; margin-top: 2px; }
.row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.cmd { display: flex; align-items: center; gap: 6px; margin-top: 6px; background: var(--bg-2); border-radius: 8px; padding: 5px 5px 5px 10px; min-width: 0; flex: 1; }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; }
.cmd button { border: 0; background: var(--surface); border-radius: 6px; padding: 3px 8px; font-size: 12px; box-shadow: 0 0 0 1px var(--border); }
.dlg-f { padding: 4px 22px 20px; color: var(--text-2); font-size: 13px; }
.dlg-f .example { margin-top: 6px; }
.dlg-f .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

.toast { position: absolute; left: 50%; bottom: 82px; transform: translate(-50%, 8px); opacity: 0; z-index: 8; padding: 8px 14px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 500; pointer-events: none; transition: opacity .2s var(--ease), transform .2s var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 820px) {
  .summary .lbl { display: none; }
  .brand h1 { font-size: 16px; }
  .topbar { gap: 8px; padding: 0 10px; }
  #b-conn .txt { display: none; }
}
@media (max-width: 900px) {
  body.side-open .drawer { width: min(720px, calc(100% - 32px)); }
}
@media (max-width: 560px) {
  .summary { display: none; }
  .side { top: auto; height: 66%; }
  .brand h1 { display: none; }
  .seg button { padding: 5px 10px; }
  #b-conn { padding: 6px 9px; }
  .attn { left: 12px; right: 12px; transform: translateY(-8px); }
  .attn.show { transform: none; }
  .attn .msg { flex: 1; }
  .ev { grid-template-columns: 56px 20px minmax(60px, 96px) 1fr; }
  .drawer { height: 230px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="8" fill="var(--accent)"/><circle cx="10" cy="12.5" r="2.6" fill="#fff"/><circle cx="18" cy="12.5" r="2.6" fill="#fff"/><circle cx="10.5" cy="13" r="1.1" fill="#1f1e1b"/><circle cx="18.5" cy="13" r="1.1" fill="#1f1e1b"/><path d="M9.5 18.5 q4.5 3.4 9 0" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
    <h1 id="title">AgentBoard</h1>
  </div>
  <div class="seg" role="group" aria-label="Scene">
    <button type="button" data-scene="office" aria-pressed="true">Office</button>
    <button type="button" data-scene="classroom" aria-pressed="false">Classroom</button>
  </div>
  <div class="spacer"></div>
  <div class="summary" id="summary" aria-live="polite"></div>
  <button type="button" class="btn" id="b-team" aria-pressed="false" title="Show or hide your team"><span aria-hidden="true">👥</span><span class="txt">Team</span></button>
  <button type="button" class="btn" id="b-conn" title="Connect Claude Code and Codex"><span class="conn-dots" aria-hidden="true"><i id="cd-cc"></i><i id="cd-cx"></i></span><span class="txt" id="conn-txt">Setup</span></button>
  <div class="menu-wrap">
    <button type="button" class="icon-btn" id="b-menu" aria-haspopup="menu" aria-expanded="false" aria-label="More options">⋯</button>
    <div class="menu" id="menu" role="menu" aria-label="More options">
      <button type="button" role="menuitem" id="m-room">Shuffle the room <span aria-hidden="true">🎲</span></button>
      <button type="button" role="menuitem" id="m-looks">Shuffle everyone's looks <span aria-hidden="true">🎨</span></button>
      <button type="button" role="menuitem" id="m-reset">Reset looks</button>
      <hr>
      <div class="label">Lighting</div>
      <button type="button" role="menuitemradio" data-light="auto">Follow my clock</button>
      <button type="button" role="menuitemradio" data-light="day">Always day</button>
      <button type="button" role="menuitemradio" data-light="night">Always night</button>
      <hr>
      <button type="button" role="menuitemcheckbox" id="m-demo" aria-checked="false">Demo mode</button>
      <button type="button" role="menuitem" id="m-welcome">Getting started</button>
      <button type="button" role="menuitem" id="m-fit">Fit to window <kbd>F</kbd></button>
    </div>
  </div>
</header>

<main id="stage">
  <canvas id="game" aria-hidden="true"></canvas>
  <nav class="sr-only" id="roster" aria-label="Team members (press Enter for details)"></nav>

  <div class="attn" id="attn" role="status">
    <span class="ico st-waiting" id="attn-ico" aria-hidden="true">✋</span>
    <span class="msg" id="attn-msg"></span>
    <button type="button" class="btn" id="attn-go">Show</button>
  </div>
  <div class="tip" id="tip" aria-hidden="true"></div>

  <aside class="side" id="side" aria-label="Your team" aria-hidden="true">
    <div class="listview">
      <div class="side-h"><h2>Your team</h2><span class="sub" id="team-sub"></span><button type="button" class="icon-btn" id="side-close" aria-label="Hide the team list">✕</button></div>
      <ul class="team" id="team"></ul>
      <div class="side-f"><button type="button" class="btn" id="side-setup">Connect Claude Code &amp; Codex</button></div>
    </div>
    <div class="detail">
      <button type="button" class="back" id="p-back">‹ Your team</button>
      <div class="sheet-h">
        <canvas id="portrait" width="168" height="168" aria-hidden="true"></canvas>
        <div style="min-width:0">
          <h2 id="p-name">—</h2>
          <div class="role" id="p-role"></div>
          <div class="chips" id="p-chips"></div>
        </div>
      </div>
      <div class="sheet-b">
        <div class="now"><div class="lbl">Right now</div><div class="val" id="p-now"></div><div class="sub" id="p-task"></div></div>
        <dl class="kv">
          <dt>Works in</dt><dd id="p-plat"></dd>
          <dt>Model</dt><dd id="p-model"></dd>
          <dt>Tools</dt><dd id="p-tools"></dd>
          <dt>Last seen</dt><dd id="p-seen"></dd>
        </dl>
        <div class="desc" id="p-desc"></div>
        <h3>Recent activity</h3>
        <div id="p-events"></div>
      </div>
    </div>
  </aside>

  <section class="drawer collapsed" id="drawer" aria-label="Activity">
    <div class="drawer-h">
      <h2>Activity</h2>
      <div class="ticker" id="ticker" aria-hidden="true"></div>
      <button type="button" class="icon-btn" id="d-toggle" aria-expanded="false" aria-controls="feed" aria-label="Show or hide activity"><span class="chev">⌄</span></button>
    </div>
    <div class="filters">
      <select id="f-agent" aria-label="Filter by person"><option value="">Everyone</option></select>
      <select id="f-platform" aria-label="Filter by tool"><option value="">Claude Code and Codex</option><option value="claude-code">Claude Code only</option><option value="codex">Codex only</option></select>
      <span class="n" id="f-count"></span>
    </div>
    <ol id="feed" aria-live="polite" aria-relevant="additions"></ol>
  </section>

  <div class="toast" id="toast" role="status"></div>
</main>

<dialog id="conn" aria-labelledby="conn-title">
  <div class="dlg-h">
    <div style="flex:1">
      <h2 id="conn-title">Connect your agents</h2>
      <p id="conn-sub"></p>
    </div>
    <button type="button" class="icon-btn" id="conn-close" aria-label="Close">✕</button>
  </div>
  <div class="dlg-b" id="conn-body"><div class="empty">Checking…</div></div>
  <div class="dlg-f" id="conn-foot"></div>
</dialog>

<script>
(() => {
'use strict';
// count page errors (shown nowhere; handy for automated checks: <body data-errors="n">)
let errCount = 0;
window.addEventListener('error', (e) => { errCount++; document.body.dataset.errors = String(errCount); document.body.dataset.lastError = String(e.message || e).slice(0, 200); });

// ============================================================================
// constants & utils
// ============================================================================
const HW = 32, HH = 16, ZS = 46;            // iso: half tile width/height, px per unit of height
const TAU = Math.PI * 2;
const SEAT_Z = 0.3, DESK_Z = 0.5, HEAD_R = 10.5;
const CAM_YAW = Math.PI / 4;                // the world direction that faces the viewer
const OUT = '#2b2238';                      // outline ink for the game world
const STATES = ['idle', 'thinking', 'working', 'waiting', 'done', 'error'];
const SI = {
  idle:     { icon: '–', label: 'Free',      color: '#a8a29e' },
  thinking: { icon: '…', label: 'Thinking',  color: '#5b8def' },
  working:  { icon: '▶', label: 'Working',   color: '#3fa66b' },
  waiting:  { icon: '✋', label: 'Needs you', color: '#e8a33d' },
  done:     { icon: '✓', label: 'Done',      color: '#8b6fe8' },
  error:    { icon: '!', label: 'Stuck',     color: '#e5534b' },
  stale:    { icon: 'z', label: 'Asleep',    color: '#8c8a82' },
};
const PLAT = { 'claude-code': { tag: 'CC', name: 'Claude Code', color: '#c96442' }, codex: { tag: 'Codex', name: 'Codex', color: '#10a37f' } };
const DONE_MS = 10_000, STALE_MS = 5 * 60_000, FEED_MAX = 400;
const params = new URLSearchParams(location.search);
const DEMO = params.get('demo') === '1';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = 'ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';
const GAME_FONT = 'ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif';
const EMOJI_FONT = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

function hexRgb(h) { const n = parseInt(h.slice(1, 7), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function clip(s, n) { s = String(s ?? ''); const a = [...s]; return a.length > n ? a.slice(0, n - 1).join('') + '…' : s; }

function ago(ts) { const s = Math.max(0, Math.round((Date.now() - ts) / 1000)); if (s < 5) return 'just now'; if (s < 60) return s + 's ago'; if (s < 3600) return Math.round(s / 60) + 'm ago'; if (s < 86400) return Math.round(s / 3600) + 'h ago'; return Math.round(s / 86400) + 'd ago'; }
const $ = (s) => document.querySelector(s);
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch { return null; } return null; }

// theme tokens shared by the page and the canvas overlays
let TK = {};
function readTokens() {

readTokens();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', readTokens);

// iso projection: world (x, y on the floor, z up) -> world-screen px
const P = (x, y, z = 0) => [(x - y) * HW, (x + y) * HH - z * ZS];

// ============================================================================

// ============================================================================
const PAL = {
  walls: [
    { wall: '#f3e4cf', trim: '#c7a07c', stripe: '#ead6bb' }, { wall: '#dbe8f2', trim: '#93abc4', stripe: '#cddcea' },
    { wall: '#e7ddf4', trim: '#a996cc', stripe: '#dccff0' }, { wall: '#e2efdc', trim: '#93b585', stripe: '#d4e6cc' },
    { wall: '#f6ddd5', trim: '#cc917f', stripe: '#efcdc2' }, { wall: '#fdf0c8', trim: '#d0aa5c', stripe: '#f6e3a8' },
    { wall: '#f1ece2', trim: '#b9a88f', stripe: '#e7dfd1' },
  ],
  floors: [
    { kind: 'wood', a: '#d9a873', b: '#d09c67', line: '#b4804f' }, { kind: 'wood', a: '#c48c5c', b: '#b98153', line: '#9b683d' },
    { kind: 'wood', a: '#e2c49a', b: '#d9b98c', line: '#bf9b6c' }, { kind: 'carpet', a: '#9cb6ca', b: '#94aec2', line: '#87a1b6' },
    { kind: 'tile', a: '#efe8dc', b: '#e0d7c8', line: '#cfc4b2' }, { kind: 'carpet', a: '#b6a6d0', b: '#ad9dc8', line: '#9f90bb' },
    { kind: 'tile', a: '#dfeee8', b: '#cfe3db', line: '#b9d2c8' },
  ],
  desks: ['#f3e5d0', '#e9d2ae', '#fbfbfb', '#d8b388', '#d3dde8', '#c99d72'],
  rugs: ['#f2b8a2', '#a7d3c4', '#f6d78b', '#b9c4f0', '#e7b7d8', '#c4e3a6', '#ffd1a1'],
  sofa: ['#e76f51', '#2a9d8f', '#7b6cf6', '#f4a261', '#457b9d', '#e5989b', '#6a994e'],
  art: ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b5de5', '#f15bb5', '#00bbf9', '#fee440', '#ff924c'],
  pants: ['#2f3e5c', '#3b3b45', '#c2a878', '#4a6fa5', '#232323', '#5b6b3a', '#6b4a3a', '#7a7f8c', '#8a3b3b'],
  shoes: ['#f4f4f4', '#2b2b2b', '#7a4b2a', '#e84a5f', '#3d7dd8', '#f2c94c', '#4caf7d'],
  mugs: ['#ff6b6b', '#4d96ff', '#ffd93d', '#6bcb77', '#ffffff', '#9b5de5', '#ff9f43'],
  cats: [{ c: '#f4a259', s: '#d97d35' }, { c: '#3b3b3b', s: '#222222' }, { c: '#f2f2f2', s: '#cfcfcf' }, { c: '#9e9e9e', s: '#7a7a7a' }, { c: '#c47a3a', s: '#8f5424' }],
};
const LOOK_POOL = {
  skin: ['#ffdbac', '#f5d0b0', '#f1c27d', '#e0ac69', '#c68642', '#a1665e', '#8d5524', '#6b3e26'],
  hair: ['#2b1b17', '#6b4423', '#b5651d', '#e8b96a', '#3b3b3b', '#7a3e1d', '#c0392b', '#d9d2c5', '#5b4bd1', '#e86aa6'],
  hairStyle: ['short', 'long', 'bun', 'curly', 'bald'],
  outfit: ['#4f46e5', '#0ea5e9', '#f97316', '#10b981', '#dc2626', '#9333ea', '#db2777', '#eab308', '#0891b2', '#65a30d', '#64748b', '#be185d'],
  accessory: ['none', 'glasses', 'headset', 'cap', 'scarf', 'badge'],
};
const EMOTES = ['😂', '☕', '🚀', '👀', '🐛', '✨', '🍕', '🎉', '🤔', '💡', 'lol', 'ship it!', 'nice', '🔥', '👍', '🙌', '🍩', '🎧', '📦', '✅', 'GG', 'brb', '🌮', '😅', 'wait what', '🧪', '🐱'];

// ============================================================================
// data layer: team, events, effective state
// ============================================================================
let team = null;
const agents = new Map();
const feed = [];
let feedSeq = 0;
let scene = 'office';
let selected = null, hovered = null;
let sceneSetByUser = false;
let guestCounter = 0;
let hudDirty = true;

function friendlyGuestName(id) {
  const known = { 'general-purpose': 'Helper', explore: 'Explorer', plan: 'Planner', 'codex-main': 'Codex Lead', default: 'Helper', worker: 'Worker', explorer: 'Explorer' };
  const k = String(id).replace(/^.*:/, '');
  if (known[k.toLowerCase()]) return known[k.toLowerCase()];
  return clip(k.replace(/[-_]+/g, ' ').replace(/\b\w/g, (m) => m.toUpperCase()), 16);
}
function guestDef(id, platform) {
  const r = mulberry32(hashStr(id));
  return {
    id, displayName: friendlyGuestName(id), platform: platform === 'codex' ? 'codex' : 'claude-code',
    role: 'Visitor (a built-in agent, not in team.json)', description: '', model: '—', tools: [],
    look: { skin: pick(LOOK_POOL.skin, r), hair: pick(LOOK_POOL.hair, r), hairStyle: pick(LOOK_POOL.hairStyle, r), outfit: pick(LOOK_POOL.outfit, r), accessory: pick(['none', 'none', 'glasses', 'cap'], r), deskItem: 'laptop' },
    guest: true,
  };
}
function ensureAgent(id, platform) {
  let a = agents.get(id);
  if (!a) {
    a = { def: guestDef(id, platform), state: 'idle', detail: '', task: '', ts: 0, events: [], guest: true, firstSeen: ++guestCounter };
    agents.set(id, a); onRosterChange();
  }
  return a;
}
function applyTeam(t) {
  team = t;
  document.title = (t.title || 'AgentBoard') + ' · AgentBoard';
  $('#title').textContent = t.title || 'AgentBoard';
  const keep = new Map(agents); agents.clear();
  for (const def of t.agents || []) {
    const old = keep.get(def.id);
    agents.set(def.id, old ? { ...old, def, guest: false } : { def, state: 'idle', detail: '', task: '', ts: 0, events: [], guest: false, firstSeen: 0 });
    keep.delete(def.id);
  }
  for (const [id, a] of keep) if (a.guest) agents.set(id, a);

function normState(s) { s = String(s || '').toLowerCase(); return STATES.includes(s) ? s : 'idle'; }
function ingest(ev, live = true) {
  if (!ev || typeof ev.agent !== 'string') return;

  const a = ensureAgent(ev.agent, ev.platform);
  const e = { ts, agent: ev.agent, platform: ev.platform || a.def.platform, state: normState(ev.state), detail: String(ev.detail ?? ''), task: ev.task ? String(ev.task) : '', source: ev.source || '' };

    a.state = e.state; a.detail = e.detail; a.ts = ts;

}
function effState(a, now = Date.now()) {
  if (a.state === 'done' && now - a.ts > DONE_MS) return { state: 'idle', stale: false };

    let last = a.ts;
    if (a.def.id === team?.lead) for (const b of agents.values()) if (b.ts > last) last = b.ts;   // the lead waits on its team

// ============================================================================
// looks & personalities
// ============================================================================

  if (looksSeed) {
    const r = mulberry32(hashStr(def.id) ^ looksSeed);
    look = { ...look, skin: pick(LOOK_POOL.skin, r), hair: pick(LOOK_POOL.hair, r), hairStyle: pick(LOOK_POOL.hairStyle, r), outfit: pick(LOOK_POOL.outfit, r), accessory: pick(LOOK_POOL.accessory, r) };

  look.height = 0.95 + r2() * 0.1; look.build = 0.92 + r2() * 0.18;

// Role icons and desk props, guessed from the id / title / role so any team works.
const ROLE_RULES = [

  [/market|sales|growth|copy|brand/, '📣', ['megaphone', 'chart']], [/review/, '🔍', ['magnifier']], [/\bqa\b|^qa|test/, '🧪', []],
  [/research|docs|analyst/, '📚', []], [/devops|infra|\bops\b|sre/, '🛠️', ['duck']], [/engineer|developer|builder|backend|frontend|coder|programmer/, '💻', ['duck']],

const roleProps = (def) => roleRule(def)?.[2] || [];
const MEETING_LINES = ['agreed', 'next steps?', '📊', 'love it', '🤔', 'ship it', 'one sec', '✅', 'good point', '🗓️', 'who owns this?', '👍'];

// ============================================================================
// drawing primitives
// ============================================================================
function path(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }

// A box on the floor grid, rotated by yaw around its centre. d = size along yaw, w = size across.
// onFace(i, A, B, z0, z1) runs for each visible side; face 0 points along yaw.
function rbox(ctx, cx, cy, d, w, z0, z1, yaw, col, o = {}) {

    w.suns.push({ a: y, b: y + 1.35, z0: 0.95, z1: 2.05, side: 'left' });

  w.wallItems.push({ kind: 'clock', side: 'right', a: cx + 2.75, z: 1.75 });
  w.wallItems.push(poster('right', Math.max(2.2, cx - 3.6), 1.1, rng, 0.75, 'abc'));
  if (W > 10) w.wallItems.push(poster('right', cx + 3.4, 1.1, rng, 0.7, 'math'));

// particles
// ============================================================================
function burst(kind, c) {

  const x = c.x, y = c.y, top = (c.seated ? SEAT_Z + 0.75 : 1.2) * (c.look?.height || 1);
  if (kind === 'confetti') for (let i = 0; i < 26; i++) particles.push({ k: 'conf', x, y, z: top, vx: rand(-1.1, 1.1), vy: rand(-1.1, 1.1), vz: rand(1.2, 2.6), life: rand(1.3, 2), max: 2, col: pick(['#ffd93d', '#ff6b6b', '#6bcb77', '#4d96ff', '#9b5de5', '#f15bb5']), rot: rand(0, TAU), vr: rand(-12, 12) });
  if (kind === 'storm') particles.push({ k: 'scrib', x, y, z: top, life: 3, max: 3, owner: c });
  if (kind === 'hearts') for (let i = 0; i < 4; i++) particles.push({ k: 'heart', x: x + rand(-0.2, 0.2), y: y + rand(-0.2, 0.2), z: 0.7, vz: 0.35, life: 2.4, max: 2.4, delay: i * 0.6 });

function updateParticles(dt) {

    if (p.k === 'conf') { p.vz -= 5.5 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z = Math.max(0.01, p.z + p.vz * dt); if (p.z <= 0.01) { p.vx *= 0.8; p.vy *= 0.8; p.vz = 0; } p.rot += p.vr * dt; }
    else if (p.k === 'drop') { p.vz -= 6 * dt; p.z += p.vz * dt; if (p.z < 0) p.life = 0; }
    else p.z += (p.vz || 0) * dt;

  for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
  for (const c of chars.values()) if (!c.gone && c.asleep && c.sk && Math.random() < dt * 0.8) particles.push({ k: 'z', x: c.sk.head.x, y: c.sk.head.y, z: c.sk.head.z + 0.25, vz: 0.28, life: 2.6, max: 2.6 });
  if (cat && cat.mode === 'sleep' && Math.random() < dt * 0.5) particles.push({ k: 'z', x: cat.x, y: cat.y, z: 0.35, vz: 0.25, life: 2.2, max: 2.2, small: true });

// ============================================================================
// canvas, camera, frame loop
// ============================================================================

function resize() {

const toScreen = (wx, wy) => [(wx - cam.x) * cam.z + vw / 2, (wy - cam.y) * cam.z + vh / 2];
const toWorld = (sx, sy) => [(sx - vw / 2) / cam.z + cam.x, (sy - vh / 2) / cam.z + cam.y];

function computeLight() {

function syncSceneButtons() { document.querySelectorAll('[data-scene]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scene === scene))); }
document.querySelectorAll('[data-scene]').forEach((b) => b.addEventListener('click', () => {
  if (scene === b.dataset.scene) return;
  scene = b.dataset.scene; sceneSetByUser = true; store('agentboard.scene', scene); syncSceneButtons();
  cam.manual = false; worldDirty = true;
}));
function closeMenu() { $('#menu').classList.remove('open'); $('#b-menu').setAttribute('aria-expanded', 'false'); }
$('#b-menu').addEventListener('click', (e) => { e.stopPropagation(); const open = !$('#menu').classList.contains('open'); $('#menu').classList.toggle('open', open); $('#b-menu').setAttribute('aria-expanded', String(open)); if (open) $('#menu button')?.focus(); });
document.addEventListener('click', (e) => { if (!e.target.closest('.menu-wrap')) closeMenu(); });
$('#m-room').addEventListener('click', () => { roomSeed = (Math.random() * 1e9) | 0; worldDirty = true; cam.manual = false; closeMenu(); toast('New room'); });
$('#m-looks').addEventListener('click', () => { looksSeed = ((Math.random() * 1e9) | 0) || 1; store('agentboard.looks', String(looksSeed)); for (const c of chars.values()) c.refreshLook(); closeMenu(); toast('New looks for everyone'); });
$('#m-reset').addEventListener('click', () => { looksSeed = 0; store('agentboard.looks', null); for (const c of chars.values()) c.refreshLook(); closeMenu(); toast('Looks reset'); });
function syncLight() { document.querySelectorAll('[data-light]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.light === lightMode))); }
document.querySelectorAll('[data-light]').forEach((b) => b.addEventListener('click', () => { lightMode = b.dataset.light; store('agentboard.light', lightMode); syncLight(); computeLight(); closeMenu(); }));
$('#m-fit').addEventListener('click', () => { cam.manual = false; fitCamera(false); closeMenu(); });
$('#m-demo').setAttribute('aria-checked', String(DEMO));
$('#m-demo').addEventListener('click', () => { closeMenu(); goMode(DEMO ? 'live' : 'demo'); });
$('#m-welcome').addEventListener('click', () => { closeMenu(); openSetup(true); });
function setDrawer(open) {
  $('#drawer').classList.toggle('collapsed', !open);
  $('#d-toggle').setAttribute('aria-expanded', String(open));
  store('agentboard.drawer', open ? '1' : '0');
  if (!cam.manual) setTimeout(() => fitCamera(false), 30);
}
$('#d-toggle').addEventListener('click', () => setDrawer($('#drawer').classList.contains('collapsed')));
$('#ticker').addEventListener('click', () => setDrawer(true));
$('#f-agent').addEventListener('change', () => { feedSig = ''; renderFeed(); });
$('#f-platform').addEventListener('change', () => { feedSig = ''; renderFeed(); });
if (store('agentboard.drawer') === '1') { $('#drawer').classList.remove('collapsed'); $('#d-toggle').setAttribute('aria-expanded', 'true'); }
setSide(sideOpen, false);
syncLight();
{ const sc = params.get('scene') || store('agentboard.scene'); if (sc === 'office' || sc === 'classroom') { scene = sc; sceneSetByUser = true; } }
syncSceneButtons();

// ============================================================================
// live connection & demo
// ============================================================================
function resetAll() {
  feed.length = 0; feedSeq++;
  for (const [id, a] of [...agents]) { if (a.guest) agents.delete(id); else Object.assign(a, { state: 'idle', detail: '', task: '', ts: 0, events: [] }); }
  onRosterChange();
}
function connect() {
  const es = new EventSource('/events');
  es.addEventListener('reset', () => resetAll());
  es.addEventListener('replay', (m) => {
    let arr = []; try { arr = JSON.parse(m.data); } catch { /* ignore */ }
    arr.sort((p, q) => (Date.parse(p.ts) || 0) - (Date.parse(q.ts) || 0));
    for (const ev of arr) ingest(ev, false);
  });
  es.addEventListener('agent-event', (m) => { try { ingest(JSON.parse(m.data), true); } catch { /* ignore */ } });
  es.addEventListener('team', async () => { try { applyTeam(await (await fetch('/team.json', { cache: 'no-store' })).json()); } catch { /* ignore */ } });
  es.addEventListener('error', () => { $('#b-conn').title = 'Lost the board server; retrying…'; });
}
const DEMO_LINES = {
  thinking: ['Reading the brief', 'Weighing two approaches', 'Tracing the call path', 'Checking assumptions'],
  working: ['Running tests', 'Editing api/routes.ts', 'Reading src/app.tsx', 'grep "useSession"', 'npm run lint', 'Writing migration', 'Styling the header', 'git diff main', 'Fetching docs page', 'Adding test cases', 'Building the bundle', '$ cargo build'],
  done: ['Tests pass (42/42)', 'PR ready for review', 'No issues found', 'Plan ready: 5 steps', 'Docs summary sent'],
  waiting: ['Needs approval: rm build/', 'Which API version?', 'Permission: Bash'],
  error: ['Build failed: TS2345', 'Command timed out', 'Tests failed (3)'],
};
const DEMO_TASKS = ['Add dark mode toggle', 'Fix login redirect bug', 'Paginate /api/items', 'Write onboarding docs', 'Speed up search'];
function demo() {
  const speed = clamp(Number(params.get('speed')) || 1, 0.2, 20);
  const emit = (agent, state, detail, task) => { const a = agents.get(agent); ingest({ ts: new Date().toISOString(), agent, platform: a?.def.platform || 'claude-code', state, detail, task }, true); };
  const ids = () => [...agents.keys()];
  const seed = ['working', 'thinking', 'idle', 'working', 'idle', 'working', 'waiting'];
  ids().forEach((id, i) => { const s = seed[i % seed.length]; emit(id, s, s === 'idle' ? 'Ready' : pick(DEMO_LINES[s] || ['Ready']), pick(DEMO_TASKS)); });
  let tick = 0;
  setInterval(() => {
    tick++;
    const all = ids(); if (!all.length) return;
    const id = pick(all), a = agents.get(id), cur = a.state, r = Math.random();
    let next;
    if (cur === 'idle') next = r < 0.35 ? 'idle' : r < 0.7 ? 'thinking' : 'working';
    else if (cur === 'done') next = r < 0.6 ? 'idle' : 'thinking';
    else if (cur === 'thinking') next = r < 0.8 ? 'working' : 'idle';
    else if (cur === 'working') next = r < 0.55 ? 'working' : r < 0.8 ? 'done' : r < 0.9 ? 'thinking' : r < 0.95 ? 'waiting' : 'error';
    else next = r < 0.6 ? 'working' : 'idle';
    if (tick % 29 === 0) next = 'error';
    if (tick % 19 === 0) next = 'waiting';
    emit(id, next, next === 'idle' ? 'Ready' : pick(DEMO_LINES[next] || ['…']), cur === 'idle' || cur === 'done' ? pick(DEMO_TASKS) : '');
    // now and then a built-in subagent drops by (walks in through the door, leaves when idle)
    if (tick % 23 === 7) ingest({ ts: new Date().toISOString(), agent: pick(['Explore', 'general-purpose']), platform: 'claude-code', state: pick(['working', 'thinking']), detail: pick(DEMO_LINES.working) }, true);
    if (tick % 23 === 15) for (const g of ['Explore', 'general-purpose']) if (agents.has(g)) ingest({ ts: new Date().toISOString(), agent: g, platform: 'claude-code', state: 'done', detail: 'Found 3 files' }, true);
  }, 1700 / speed);
}

// ============================================================================
// boot
// ============================================================================
async function boot() {
  resize();
  try { applyTeam(await (await fetch('/team.json', { cache: 'no-store' })).json()); }
  catch { $('#ticker').innerHTML = '<span class="t">Couldn\'t load team.json. Start the board with <code>node agentboard/server.mjs</code>.</span>'; return; }
  computeLight();
  if (DEMO) demo();
  else {
    connect();
    loadStatus().then(() => {
      const fresh = connStatus && !connStatus.claude.last && !connStatus.codex.last;
      if (store('agentboard.welcomed') === null && fresh) openSetup(true);
    });
    setInterval(loadStatus, 30_000);
  }
  requestAnimationFrame(frame);
}
boot();
// Debug hook: fast-forward the world (with random events and drawing) to shake out bugs without waiting.
function simulate(seconds = 60, opts = {}) {
  const dt = 1 / 30, ids = () => [...agents.keys()];
  let t = 0, nextEv = 0, n = 0;
  const states = ['idle', 'thinking', 'working', 'waiting', 'done', 'error'];
  if (worldDirty) rebuildWorld();
  while (t < seconds) {
    if (t >= nextEv) {
      nextEv = t + (opts.every || 0.4);
      const visitor = Math.random() < 0.08;
      const id = visitor ? pick(['Explore', 'general-purpose', 'Plan']) : pick(ids());
      const a = agents.get(id);
      ingest({ ts: new Date(Date.now() + t * 1000).toISOString(), agent: id, platform: a?.def.platform || 'claude-code', state: pick(states), detail: pick(DEMO_LINES.working), task: pick(DEMO_TASKS) }, true);
      n++;
      if (opts.rebuild && Math.random() < 0.01) { roomSeed = (Math.random() * 1e9) | 0; worldDirty = true; }
      if (opts.scenes && Math.random() < 0.01) { scene = scene === 'office' ? 'classroom' : 'office'; worldDirty = true; }
    }
    if (worldDirty) rebuildWorld();
    clock += dt; t += dt;
    for (const c of chars.values()) { c.t += 0; c.update(dt); }
    if (cat) cat.update(dt);
    updatePong(dt);
    updateParticles(dt);
    world.doorOpen = damp(world.doorOpen, clock < world.doorOpenUntil ? 1 : 0, 6, dt);
    if (Math.round(t / dt) % 6 === 0) render();
  }
  renderHud();
  return { events: n, chars: chars.size, gone: [...chars.values()].filter((c) => c.gone).length, walking: [...chars.values()].filter((c) => c.walking).length, seated: [...chars.values()].filter((c) => c.seated).length, particles: particles.length, scene };
}
window.__agentboard = { agents, chars, feed, effState, get world() { return world; }, get cam() { return cam; }, ingest: (e) => ingest(e, true), select, focusOn, simulate };
})();
